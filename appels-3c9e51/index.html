<style>
#lkgate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#eeeeea;color:#14181c;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px;box-sizing:border-box}
#lkgate input{width:100%;box-sizing:border-box;text-align:center;letter-spacing:.4em;font-size:22px;padding:12px 14px;border:1px solid #00000022;border-radius:12px;background:#fff;color:inherit;outline:none}
#lkgate input:focus{border-color:#00000055}
#lkgate button{margin-top:6px;width:100%;padding:12px;border:0;border-radius:12px;background:#14181c;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){
  #lkgate{background:#14181c;color:#eeeeea}
  #lkgate input{background:#1e242a;border-color:#ffffff22;color:#eeeeea}
  #lkgate button{background:#c6ff3a;color:#14181c}
}
</style>

<!-- même code et même mémorisation que le carnet : débloqué ici = débloqué là-bas -->
<div id="lkgate">
  <form id="lkgate-form" style="width:min(320px,86vw);text-align:center">
    <div style="font-size:34px;margin-bottom:10px">🔒</div>
    <h1 style="font-size:18px;margin:0 0 4px">Liste d'appels</h1>
    <p style="margin:0 0 18px;opacity:.7;font-size:14px">Entre ton code pour accéder</p>
    <input id="lkgate-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" aria-label="Code d'accès">
    <p id="lkgate-err" style="min-height:18px;margin:8px 0 0;color:#c0392b;font-size:13px"></p>
    <button type="submit">Entrer</button>
  </form>
</div>
<script>
(function(){
  var KEY='lk_tournee_ok';
  var H='cf820c86e58c16ff09ebacd16f47278637f18a71a863a63910d6b02644c91765';
  var SALT='lk-tournee:';
  var g=document.getElementById('lkgate');
  try{ if(localStorage.getItem(KEY)==='1'){ g.parentNode.removeChild(g); return; } }catch(e){}
  document.documentElement.style.overflow='hidden';
  var f=document.getElementById('lkgate-form'),pin=document.getElementById('lkgate-pin'),err=document.getElementById('lkgate-err');
  setTimeout(function(){ try{pin.focus();}catch(e){} },60);
  function sha(s){ var b=new TextEncoder().encode(s); return crypto.subtle.digest('SHA-256',b).then(function(h){ return Array.prototype.map.call(new Uint8Array(h),function(x){return('0'+x.toString(16)).slice(-2)}).join(''); }); }
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var v=(pin.value||'').trim();
    if(!v){ return; }
    sha(SALT+v).then(function(hv){
      if(hv===H){
        try{ localStorage.setItem(KEY,'1'); }catch(e){}
        document.documentElement.style.overflow='';
        g.parentNode.removeChild(g);
      } else {
        err.textContent='Code incorrect';
        pin.value=''; pin.focus();
      }
    }).catch(function(){ err.textContent='Erreur, réessaie'; });
  });
})();
</script>
