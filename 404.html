<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b0c; color: #f4f2ec; font-family: 'Instrument Sans', sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 6vw, 60px); text-align: center; overflow-x: hidden;
  }
  ::selection { background: #c9f24d; color: #0b0b0c; }
  .glow { position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: min(760px, 120vw); height: min(760px, 120vw); background: radial-gradient(circle, rgba(201,242,77,.15), transparent 62%); pointer-events: none; }
  .box { position: relative; width: min(560px, 100%); }
  .logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -.02em; color: #f4f2ec; text-decoration: none; }
  .logo span { color: #c9f24d; }
  .code { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #c9f24d; margin-top: 42px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(2.3rem, 9vw, 3.6rem); line-height: 1.03; letter-spacing: -.035em; margin-top: 16px; }
  p { color: #b8b5ad; font-size: clamp(.98rem, 2.6vw, 1.08rem); line-height: 1.6; margin-top: 18px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; background: #c9f24d; color: #0b0b0c; font-weight: 600; font-size: 16px; padding: 15px 26px; border-radius: 100px; text-decoration: none; margin-top: 30px; transition: background .3s ease; }
  .cta:hover { background: #fff; }
  .links { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; margin-top: 30px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .links a { color: #7c7a72; text-decoration: none; }
  .links a:hover { color: #c9f24d; }
</style>
</head>

<div class="glow" aria-hidden="true"></div>
